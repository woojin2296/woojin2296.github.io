        - text: 감시 대상과 알림 채널을 분리한 덕분에 새로운 서버나 알림 방식을 추가할 때 기존 Watchdog 전체를 수정하지 않아도 되는 구조를 만들 수 있었습니다. 다만 Watchdog과 백엔드 사이를
        - strong [ref=e138]: TCP socket
        - text: 으로 직접 연결한 점은 운영 중 디버깅이 어렵습니다. 다시 설계한다면 Watchdog은
