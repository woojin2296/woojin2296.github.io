      - heading "Pluggable Architecture 설계" [level=2] [ref=e93]
      - generic [ref=e94]:
        - paragraph [ref=e95]:
          - text: Watchdog의
          - strong [ref=e96]: 감지 로직
          - text: 과 Notification의
          - strong [ref=e97]: 알림 전송 로직
          - text: 을 분리했습니다. 관제 대상이 늘어나면 해당 대상의
          - strong [ref=e98]: checker 모듈
          - text: 을 추가하고, Slack 외의 알림 채널이 필요하면
          - strong [ref=e99]: notifier 모듈
          - text: 을 추가하는 구조로 설계했습니다. Backend는 Watchdog이 보낸 감지 결과를 저장하고, Frontend는 저장된 상태 이벤트를 조회하거나 WebSocket으로 전달받아 화면을 갱신합니다.
        - figure "역할별 모듈로 분리한 판옵티콘 전체 아키텍처" [ref=e100]:
          - button "역할별 모듈로 분리한 판옵티콘 전체 아키텍처 크게 보기" [ref=e101]:
            - img "역할별 모듈로 분리한 판옵티콘 전체 아키텍처" [ref=e102]
          - generic [ref=e103]: 역할별 모듈로 분리한 판옵티콘 전체 아키텍처
    - generic [ref=e104]:
      - heading "TCP Socket과 WebSocket을 사용한 상태 이벤트 전달 구조" [level=2] [ref=e106]
      - generic [ref=e107]:
        - paragraph [ref=e108]:
          - text: Watchdog은 각 감지 대상에 맞는 checker 전략을 실행하고 이상 상태를 판단합니다. 이상 상태가 확인되면 Watchdog은 감지 결과를
          - strong [ref=e109]: TCP 기반 소켓 통신
          - text: 으로 Spring Boot 백엔드에 전달합니다. 백엔드는 감지 결과를 상태 이벤트로 저장한 뒤
          - strong [ref=e110]: WebSocket
          - text: 이벤트로 변환해 Next.js 프론트엔드에 전달합니다. Slackbot도 같은 상태 이벤트를 기준으로 알림을 전송하도록 연동했습니다.
        - figure "Watchdog 상태 이벤트 전파 구조" [ref=e111]:
          - button "Watchdog 상태 이벤트 전파 구조 크게 보기" [ref=e112]:
            - img "Watchdog 상태 이벤트 전파 구조" [ref=e113]
          - generic [ref=e114]: Watchdog 상태 이벤트 전파 구조
        - paragraph [ref=e115]:
          - strong [ref=e116]: 감지 정책
          - text: 은 대상별로 다르게 잡았습니다. 서버 생존 여부는
          - strong [ref=e117]: 10초마다 ping 명령
          - text: 으로 확인했고, 데이터베이스 상태는 헬스체크 엔드포인트에
          - strong [ref=e118]: 10초마다 GET 요청
          - text: 을 보내 확인했습니다. 데이터 수집 파이프라인은 장치별 마지막 수집 시각을 확인하고,
          - strong [ref=e119]: 1분 이상 새 데이터가 들어오지 않으면
          - text: 수집 지연으로 판단했습니다. 서버 응답 상태, 헬스체크 결과, 마지막 수집 시각을 함께 확인해 단일 응답 실패와 실제 수집 중단을 구분했습니다.
    - generic [ref=e120]:
      - heading "Self-hosted Runner 기반 내부망 배포 자동화" [level=2] [ref=e122]
      - generic [ref=e123]:
        - paragraph [ref=e124]:
          - text: 서버가
          - strong [ref=e125]: 학교 내부망
          - text: 에 있어 외부에서 SSH로 접속하는 배포 파이프라인을 사용할 수 없었습니다. 내부망 서버에
          - strong [ref=e126]: self-hosted runner
          - text: 를 설치하고, GitHub Actions job이 해당 runner에서 실행되도록 구성했습니다. runner는 최신 소스 코드를 가져온 뒤
          - strong [ref=e127]: Docker 이미지를 빌드
          - text: 하고,
          - strong [ref=e128]: Docker Compose
          - text: 명령으로 컨테이너를 재배포합니다. 배포 과정에서 외부 SSH 접속 단계는 제거했습니다.
        - figure "self-hosted runner를 사용한 CI/CD 시퀀스 다이어그램" [ref=e129]:
          - button "self-hosted runner를 사용한 CI/CD 시퀀스 다이어그램 크게 보기" [ref=e130]:
            - img "self-hosted runner를 사용한 CI/CD 시퀀스 다이어그램" [ref=e131]
          - generic [ref=e132]: self-hosted runner를 사용한 CI/CD 시퀀스 다이어그램
    - generic [ref=e133]:
