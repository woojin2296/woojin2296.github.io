<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FAFAFA"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="96" y="116" fill="#000000" font-size="42" font-weight="500">요청 이력을 남겨 운영 상황을 추적</text>
    <text x="96" y="166" fill="#737373" font-size="24">주요 API 요청을 기록하고 관리자 페이지에서 문제 상황을 확인할 수 있게 구성</text>

    <rect x="108" y="300" width="280" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="140" y="352" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">REQUEST</text>
    <text x="140" y="406" fill="#000000" font-size="31" font-weight="500">API 요청</text>
    <text x="140" y="452" fill="#737373" font-size="22">로그인, 제출, 조회 등</text>
    <text x="140" y="486" fill="#737373" font-size="22">주요 요청 발생</text>

    <rect x="498" y="300" width="280" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="530" y="352" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">LOG</text>
    <text x="530" y="406" fill="#000000" font-size="31" font-weight="600">감사 로그</text>
    <text x="530" y="452" fill="#737373" font-size="22">요청자, 경로, 상태 코드,</text>
    <text x="530" y="486" fill="#737373" font-size="22">IP, 메타데이터 기록</text>

    <rect x="888" y="300" width="280" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="920" y="352" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">ADMIN</text>
    <text x="920" y="406" fill="#000000" font-size="31" font-weight="500">로그 조회</text>
    <text x="920" y="452" fill="#737373" font-size="22">경로, 메서드, IP 기준으로</text>
    <text x="920" y="486" fill="#737373" font-size="22">운영 이력 확인</text>

    <rect x="1278" y="300" width="220" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="1310" y="352" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">TRACE</text>
    <text x="1310" y="406" fill="#000000" font-size="31" font-weight="500">원인 추적</text>
    <text x="1310" y="452" fill="#737373" font-size="22">실패 요청과</text>
    <text x="1310" y="486" fill="#737373" font-size="22">사용 흐름 분석</text>

    <line x1="388" y1="395" x2="498" y2="395" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M484 383L504 395L484 407" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="778" y1="395" x2="888" y2="395" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M874 383L894 395L874 407" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="1168" y1="395" x2="1278" y2="395" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M1264 383L1284 395L1264 407" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>

    <text x="108" y="650" fill="#000000" font-size="28" font-weight="500">운영 중 문제를 재현할 단서 확보</text>
    <text x="108" y="694" fill="#737373" font-size="23">제출 실패, 로그인 실패, 관리자 작업처럼 문제 상황이 발생했을 때 요청 흐름을 다시 확인할 수 있게 했습니다.</text>
  </g>
</svg>
