<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FAFAFA"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="96" y="116" fill="#000000" font-size="42" font-weight="500">제출 파일 저장 전 다중 검증</text>
    <text x="96" y="166" fill="#737373" font-size="24">과제 제출 기능에서 발생할 수 있는 비정상 파일과 경로 조작 위험을 줄이기 위한 검증 흐름</text>

    <rect x="96" y="300" width="260" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="128" y="352" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">UPLOAD</text>
    <text x="128" y="406" fill="#000000" font-size="31" font-weight="500">파일 제출</text>
    <text x="128" y="452" fill="#737373" font-size="22">프로젝트 결과 파일</text>
    <text x="128" y="486" fill="#737373" font-size="22">업로드 요청</text>

    <rect x="468" y="300" width="260" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="500" y="352" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">CHECK 01</text>
    <text x="500" y="406" fill="#000000" font-size="31" font-weight="500">확장자 확인</text>
    <text x="500" y="452" fill="#737373" font-size="22">허용된 제출 형식인지</text>
    <text x="500" y="486" fill="#737373" font-size="22">먼저 검증</text>

    <rect x="840" y="300" width="260" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="872" y="352" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">CHECK 02</text>
    <text x="872" y="406" fill="#000000" font-size="31" font-weight="500">구조 검증</text>
    <text x="872" y="452" fill="#737373" font-size="22">JSON 구조와 null-byte</text>
    <text x="872" y="486" fill="#737373" font-size="22">포함 여부 확인</text>

    <rect x="1212" y="300" width="292" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="1244" y="352" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">CHECK 03</text>
    <text x="1244" y="406" fill="#000000" font-size="31" font-weight="600">경로 정규화</text>
    <text x="1244" y="452" fill="#737373" font-size="22">Path Traversal 위험을</text>
    <text x="1244" y="486" fill="#737373" font-size="22">저장 전 차단</text>

    <line x1="356" y1="395" x2="468" y2="395" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M454 383L474 395L454 407" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="728" y1="395" x2="840" y2="395" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M826 383L846 395L826 407" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="1100" y1="395" x2="1212" y2="395" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M1198 383L1218 395L1198 407" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>

    <text x="96" y="650" fill="#000000" font-size="28" font-weight="500">업로드 기능을 보안 경계로 보고 설계</text>
    <text x="96" y="694" fill="#737373" font-size="23">성적 평가 시스템에서 제출 파일은 외부 입력이므로 저장 전에 형식, 구조, 경로를 나눠 검증했습니다.</text>
  </g>
</svg>
