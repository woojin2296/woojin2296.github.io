<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FAFAFA"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="96" y="116" fill="#000000" font-size="42" font-weight="500">Docker Compose로 실행 환경 고정</text>
    <text x="96" y="166" fill="#737373" font-size="24">강의 운영 환경에서 개발/운영 차이를 줄이고 재배포가 가능한 구조로 구성</text>

    <rect x="124" y="330" width="300" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="156" y="382" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">APP</text>
    <text x="156" y="436" fill="#000000" font-size="31" font-weight="500">Next.js</text>
    <text x="156" y="482" fill="#737373" font-size="22">화면과 API를</text>
    <text x="156" y="516" fill="#737373" font-size="22">같은 서비스로 운영</text>

    <rect x="504" y="330" width="300" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="536" y="382" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">DATA</text>
    <text x="536" y="436" fill="#000000" font-size="31" font-weight="500">SQLite</text>
    <text x="536" y="482" fill="#737373" font-size="22">소규모 강의 운영에 맞춘</text>
    <text x="536" y="516" fill="#737373" font-size="22">단순한 데이터 계층</text>

    <rect x="884" y="330" width="300" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="916" y="382" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">RUNTIME</text>
    <text x="916" y="436" fill="#000000" font-size="31" font-weight="600">Docker Compose</text>
    <text x="916" y="482" fill="#737373" font-size="22">실행 환경과 재시작 흐름을</text>
    <text x="916" y="516" fill="#737373" font-size="22">명령으로 고정</text>

    <rect x="1264" y="330" width="220" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="1296" y="382" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">OPS</text>
    <text x="1296" y="436" fill="#000000" font-size="31" font-weight="500">운영 배포</text>
    <text x="1296" y="482" fill="#737373" font-size="22">강의 기간 동안</text>
    <text x="1296" y="516" fill="#737373" font-size="22">동일 환경 유지</text>

    <line x1="424" y1="425" x2="504" y2="425" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M490 413L510 425L490 437" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="804" y1="425" x2="884" y2="425" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M870 413L890 425L870 437" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="1184" y1="425" x2="1264" y2="425" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M1250 413L1270 425L1250 437" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>

    <text x="124" y="670" fill="#000000" font-size="28" font-weight="500">강의 운영 중 환경 차이를 줄이는 데 집중</text>
    <text x="124" y="714" fill="#737373" font-size="23">복잡한 인프라보다 재현 가능한 실행 환경과 간단한 배포 절차를 우선했습니다.</text>
  </g>
