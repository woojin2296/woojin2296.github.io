<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FAFAFA"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="96" y="116" fill="#000000" font-size="42" font-weight="500">성적 데이터 보호를 위한 서버 중심 검증</text>
    <text x="96" y="166" fill="#737373" font-size="24">SSR, 서버 세션, 권한 검사로 점수 위변조 가능성을 줄이는 구조</text>

    <rect x="124" y="310" width="300" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="156" y="362" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">LOGIN</text>
    <text x="156" y="416" fill="#000000" font-size="31" font-weight="500">로그인 요청</text>
    <text x="156" y="462" fill="#737373" font-size="22">학생/관리자 계정으로</text>
    <text x="156" y="496" fill="#737373" font-size="22">접근 시작</text>

    <rect x="504" y="310" width="300" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="536" y="362" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">SESSION</text>
    <text x="536" y="416" fill="#000000" font-size="31" font-weight="600">서버 세션</text>
    <text x="536" y="462" fill="#737373" font-size="22">HttpOnly 쿠키로</text>
    <text x="536" y="496" fill="#737373" font-size="22">클라이언트 노출 완화</text>

    <rect x="884" y="310" width="300" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="916" y="362" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">SERVER CHECK</text>
    <text x="916" y="416" fill="#000000" font-size="31" font-weight="500">서버 검증</text>
    <text x="916" y="462" fill="#737373" font-size="22">권한, 제출, 점수를</text>
    <text x="916" y="496" fill="#737373" font-size="22">단계별로 확인</text>

    <rect x="1264" y="250" width="260" height="140" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="1296" y="302" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">USER</text>
    <text x="1296" y="356" fill="#000000" font-size="30" font-weight="500">익명 랭킹</text>

    <rect x="1264" y="440" width="260" height="140" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="1296" y="492" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">ADMIN</text>
    <text x="1296" y="546" fill="#000000" font-size="30" font-weight="600">점수 관리</text>

    <line x1="424" y1="405" x2="504" y2="405" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M490 393L510 405L490 417" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="804" y1="405" x2="884" y2="405" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M870 393L890 405L870 417" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M1184 405H1220C1244 405 1244 320 1264 320" stroke="#D4D4D4" stroke-width="3" fill="none"/>
    <path d="M1184 405H1220C1244 405 1244 510 1264 510" stroke="#D4D4D4" stroke-width="3" fill="none"/>

    <text x="124" y="672" fill="#000000" font-size="28" font-weight="500">실제 성적에 반영되는 점수는 서버에서 확인</text>
    <text x="124" y="716" fill="#737373" font-size="23">클라이언트 값에 의존하지 않고 세션, 역할, 제출 데이터를 함께 확인해 접근 범위를 나눴습니다.</text>
  </g>
</svg>
