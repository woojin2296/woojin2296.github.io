<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FAFAFA"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="96" y="116" fill="#000000" font-size="42" font-weight="500">익명 점수 랭킹으로 선의의 경쟁을 만드는 흐름</text>
    <text x="96" y="166" fill="#737373" font-size="24">교수님 요청을 바탕으로 제출 결과를 점수 중심의 익명 랭킹으로 연결</text>

    <rect x="96" y="310" width="260" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="128" y="360" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">STUDENT</text>
    <text x="128" y="414" fill="#000000" font-size="31" font-weight="500">제출/점수 등록</text>
    <text x="128" y="460" fill="#737373" font-size="22">프로젝트 코드와</text>
    <text x="128" y="494" fill="#737373" font-size="22">결과 점수 등록</text>

    <rect x="468" y="310" width="260" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="500" y="360" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">SYSTEM</text>
    <text x="500" y="414" fill="#000000" font-size="31" font-weight="500">서버 검증</text>
    <text x="500" y="460" fill="#737373" font-size="22">사용자와 제출 데이터를</text>
    <text x="500" y="494" fill="#737373" font-size="22">서버 기준으로 확인</text>

    <rect x="840" y="310" width="260" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="872" y="360" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">ADMIN</text>
    <text x="872" y="414" fill="#000000" font-size="31" font-weight="500">관리자 점수 관리</text>
    <text x="872" y="460" fill="#737373" font-size="22">실제 성적 반영 점수를</text>
    <text x="872" y="494" fill="#737373" font-size="22">권한 기준으로 처리</text>

    <rect x="1212" y="310" width="292" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="1244" y="360" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">RANKING</text>
    <text x="1244" y="414" fill="#000000" font-size="31" font-weight="600">익명 랭킹</text>
    <text x="1244" y="460" fill="#737373" font-size="22">이름 없이 점수만</text>
    <text x="1244" y="494" fill="#737373" font-size="22">비교할 수 있게 공개</text>

    <line x1="356" y1="405" x2="468" y2="405" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M454 393L474 405L454 417" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="728" y1="405" x2="840" y2="405" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M826 393L846 405L826 417" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="1100" y1="405" x2="1212" y2="405" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M1198 393L1218 405L1198 417" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>

    <text x="96" y="654" fill="#000000" font-size="28" font-weight="500">점수 공개 방식으로 학습 동기 만들기</text>
    <text x="96" y="698" fill="#737373" font-size="23">학생은 자신의 위치를 확인하고, 운영자는 실제 성적 데이터를 관리자 권한 안에서 관리하도록 정리했습니다.</text>
  </g>
</svg>
