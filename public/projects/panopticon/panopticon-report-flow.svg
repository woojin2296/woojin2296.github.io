<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FAFAFA"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="96" y="116" fill="#000000" font-size="42" font-weight="500">매번 열어보던 품질 점검을 리포트로 남기기</text>
    <text x="96" y="166" fill="#737373" font-size="24">결측치, 데이터 분산, 수집량을 기준으로 이상 데이터를 정리하고 운영 점검에 활용</text>

    <rect x="124" y="286" width="300" height="210" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="156" y="338" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">INPUT</text>
    <text x="156" y="392" fill="#000000" font-size="31" font-weight="500">품질 지표</text>
    <text x="156" y="440" fill="#737373" font-size="22">결측치</text>
    <text x="156" y="474" fill="#737373" font-size="22">데이터 분산</text>
    <text x="156" y="508" fill="#737373" font-size="22">기간별 수집량</text>

    <rect x="504" y="286" width="300" height="210" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="536" y="338" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">RULE</text>
    <text x="536" y="392" fill="#000000" font-size="31" font-weight="500">이상 판별</text>
    <text x="536" y="440" fill="#737373" font-size="22">정상 범위와</text>
    <text x="536" y="474" fill="#737373" font-size="22">기간별 변화를 비교</text>

    <rect x="884" y="286" width="300" height="210" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="916" y="338" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">REPORT</text>
    <text x="916" y="392" fill="#000000" font-size="31" font-weight="500">정기 리포트</text>
    <text x="916" y="440" fill="#737373" font-size="22">일간/주간 단위로</text>
    <text x="916" y="474" fill="#737373" font-size="22">운영 상태 정리</text>

    <rect x="1264" y="286" width="300" height="210" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="1296" y="338" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">USE</text>
    <text x="1296" y="392" fill="#000000" font-size="31" font-weight="600">운영 점검</text>
    <text x="1296" y="440" fill="#737373" font-size="22">반복 확인을 줄이고</text>
    <text x="1296" y="474" fill="#737373" font-size="22">상태 변화를 추적</text>

    <line x1="424" y1="391" x2="504" y2="391" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M490 379L510 391L490 403" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="804" y1="391" x2="884" y2="391" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M870 379L890 391L870 403" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="1184" y1="391" x2="1264" y2="391" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M1250 379L1270 391L1250 403" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>

    <text x="96" y="656" fill="#000000" font-size="28" font-weight="500">조회 기능을 운영 기록으로 확장</text>
    <text x="96" y="700" fill="#737373" font-size="23">데이터를 볼 수 있게 만드는 것에서 멈추지 않고, 확인해야 할 품질 지표를 정리해 반복 점검의 부담을 줄였습니다.</text>
  </g>
</svg>
