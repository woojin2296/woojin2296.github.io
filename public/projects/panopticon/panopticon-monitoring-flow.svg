<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FAFAFA"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="96" y="116" fill="#000000" font-size="42" font-weight="500">Polling으로 감지하고 WebSocket으로 전달</text>
    <text x="96" y="166" fill="#737373" font-size="24">서버, 데이터베이스, 데이터 수집 상태를 각 주기에 맞춰 확인하고 대시보드에 실시간 반영</text>

    <rect x="96" y="246" width="330" height="150" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="128" y="294" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">SERVER</text>
    <text x="128" y="344" fill="#000000" font-size="30" font-weight="500">10초 ping</text>
    <text x="128" y="382" fill="#737373" font-size="21">서버 생존 여부 확인</text>

    <rect x="96" y="444" width="330" height="150" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="128" y="492" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">HEALTH CHECK</text>
    <text x="128" y="542" fill="#000000" font-size="30" font-weight="500">10초 GET polling</text>
    <text x="128" y="580" fill="#737373" font-size="21">DB 조회 endpoint 확인</text>

    <rect x="96" y="642" width="330" height="150" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="128" y="690" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">DATA</text>
    <text x="128" y="740" fill="#000000" font-size="30" font-weight="500">1분 수집 주기</text>
    <text x="128" y="778" fill="#737373" font-size="21">마지막 적재 시각 확인</text>

    <rect x="620" y="410" width="320" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="652" y="462" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">WATCHDOG</text>
    <text x="652" y="516" fill="#000000" font-size="31" font-weight="600">상태 변화 감지</text>
    <text x="652" y="562" fill="#737373" font-size="22">수집 지연, 중단, 응답 실패를</text>
    <text x="652" y="596" fill="#737373" font-size="22">하나의 이벤트로 정리</text>

    <rect x="1078" y="410" width="300" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="1110" y="462" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">SPRING BOOT</text>
    <text x="1110" y="516" fill="#000000" font-size="31" font-weight="500">상태 이벤트 처리</text>
    <text x="1110" y="562" fill="#737373" font-size="22">API와 실시간 전달 흐름을</text>
    <text x="1110" y="596" fill="#737373" font-size="22">백엔드에서 관리</text>

    <rect x="1042" y="682" width="260" height="130" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="1074" y="730" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">WEBSOCKET</text>
    <text x="1074" y="780" fill="#000000" font-size="29" font-weight="600">대시보드 반영</text>

    <rect x="1326" y="682" width="210" height="130" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="1358" y="730" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">NOTIFIER</text>
    <text x="1358" y="780" fill="#000000" font-size="29" font-weight="500">Slack 알림</text>

    <path d="M426 321H536C582 321 582 505 620 505" stroke="#D4D4D4" stroke-width="3" fill="none"/>
    <path d="M426 519H620" stroke="#D4D4D4" stroke-width="3" fill="none"/>
    <path d="M426 717H536C582 717 582 505 620 505" stroke="#D4D4D4" stroke-width="3" fill="none"/>
    <path d="M606 493L626 505L606 517" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>

    <line x1="940" y1="505" x2="1078" y2="505" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M1064 493L1084 505L1064 517" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>

    <path d="M1228 600V650C1228 672 1172 660 1172 682" stroke="#D4D4D4" stroke-width="3" fill="none"/>
    <path d="M1228 600V650C1228 672 1431 660 1431 682" stroke="#D4D4D4" stroke-width="3" fill="none"/>
    <path d="M1160 668L1172 688L1184 668" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M1419 668L1431 688L1443 668" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>

    <text x="620" y="706" fill="#000000" font-size="28" font-weight="500">감지와 전달을 분리</text>
    <text x="620" y="750" fill="#737373" font-size="23">감시 대상은 checker로, 알림 채널은 notifier로 추가할 수 있게 책임을 나누었습니다.</text>
  </g>
</svg>
