<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FAFAFA"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="96" y="116" fill="#000000" font-size="42" font-weight="500">내부망 서버에서도 배포가 이어지게 하기</text>
    <text x="96" y="166" fill="#737373" font-size="24">외부 SSH 접근이 어려운 환경에서 self-hosted runner를 사용해 배포 경로를 구성</text>

    <rect x="86" y="256" width="1428" height="360" fill="none" stroke="#E5E5E5" stroke-width="2" stroke-dasharray="12 12"/>
    <text x="114" y="304" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">ON-PREMISE NETWORK</text>

    <rect x="124" y="382" width="292" height="170" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="156" y="434" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">TRIGGER</text>
    <text x="156" y="488" fill="#000000" font-size="30" font-weight="500">GitHub Actions</text>
    <text x="156" y="532" fill="#737373" font-size="22">변경 사항으로 배포 시작</text>

    <rect x="514" y="382" width="292" height="170" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="546" y="434" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">RUNNER</text>
    <text x="546" y="488" fill="#000000" font-size="30" font-weight="600">Self-hosted</text>
    <text x="546" y="532" fill="#737373" font-size="22">내부망에서 명령 실행</text>

    <rect x="904" y="382" width="292" height="170" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="936" y="434" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">BUILD</text>
    <text x="936" y="488" fill="#000000" font-size="30" font-weight="500">Docker Compose</text>
    <text x="936" y="532" fill="#737373" font-size="22">서비스 실행 환경 통일</text>

    <rect x="1294" y="382" width="180" height="170" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="1326" y="434" fill="#A3A3A3" font-size="18" font-weight="500" letter-spacing="3">APP</text>
    <text x="1326" y="488" fill="#000000" font-size="30" font-weight="500">Service</text>
    <text x="1326" y="532" fill="#737373" font-size="22">운영 반영</text>

    <line x1="416" y1="467" x2="514" y2="467" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M500 455L520 467L500 479" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="806" y1="467" x2="904" y2="467" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M890 455L910 467L890 479" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="1196" y1="467" x2="1294" y2="467" stroke="#D4D4D4" stroke-width="3"/>
    <path d="M1280 455L1300 467L1280 479" stroke="#D4D4D4" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>

    <line x1="124" y1="676" x2="1474" y2="676" stroke="#D4D4D4" stroke-width="2"/>
    <text x="124" y="724" fill="#000000" font-size="28" font-weight="500">SSH로 밀어 넣는 배포가 아니라, 내부에서 당겨 실행하는 배포</text>
    <text x="124" y="768" fill="#737373" font-size="23">외부 접근 제약을 피하면서도 빌드와 컨테이너 배포를 자동화할 수 있는 구조로 정리했습니다.</text>
  </g>
</svg>
