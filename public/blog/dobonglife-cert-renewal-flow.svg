<svg width="1672" height="941" viewBox="0 0 1672 941" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Certbot 갱신 방식 전환</title>
  <desc id="desc">Nginx가 80번 포트를 점유한 상태에서 standalone 방식이 실패하고, webroot 방식으로 전환해 Nginx를 중단하지 않고 HTTP-01 challenge를 처리하는 구조</desc>
  <rect width="1672" height="941" fill="#ffffff"/>
  <text x="112" y="116" fill="#000000" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="44" font-weight="600">Certbot 갱신 방식 전환</text>
  <text x="112" y="158" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22">standalone은 80번 포트를 직접 열어야 하지만, 운영 서버에서는 Nginx가 이미 80번 포트를 사용하고 있었다.</text>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12" stroke="#737373" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #000000; font-size: 24px; font-weight: 600; }
      .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #737373; font-size: 18px; font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #525252; font-size: 17px; font-weight: 400; }
      .small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #a3a3a3; font-size: 16px; font-weight: 400; }
    </style>
  </defs>

  <rect x="112" y="228" width="660" height="512" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="2"/>
  <text class="label" x="156" y="286">기존 standalone 방식</text>
  <text class="body" x="156" y="326">Certbot이 자체 임시 웹서버를 띄워 HTTP-01 challenge를 처리한다.</text>

  <rect x="168" y="386" width="206" height="118" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  <text class="label" x="204" y="432">Nginx</text>
  <text class="mono" x="204" y="468">:80 사용 중</text>

  <rect x="510" y="386" width="206" height="118" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  <text class="label" x="548" y="432">Certbot</text>
  <text class="mono" x="548" y="468">standalone</text>

  <path d="M388 444H496" stroke="#000000" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="small" x="414" y="418">80번 포트 충돌</text>

  <rect x="168" y="568" width="548" height="92" rx="12" fill="#171717"/>
  <text x="204" y="610" fill="#ffffff" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="18">Could not bind TCP port 80</text>
  <text x="204" y="642" fill="rgba(255,255,255,0.72)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">Nginx를 멈추지 않으면 갱신을 진행할 수 없음</text>

  <rect x="900" y="228" width="660" height="512" rx="12" fill="#ffffff" stroke="#000000" stroke-width="2.4"/>
  <text class="label" x="944" y="286">전환한 webroot 방식</text>
  <text class="body" x="944" y="326">Nginx는 계속 80번 포트를 받고, Certbot은 검증 파일만 webroot에 쓴다.</text>

  <rect x="956" y="386" width="184" height="118" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="2"/>
  <text class="label" x="990" y="432">Certbot</text>
  <text class="body" x="990" y="468">token 파일 생성</text>

  <rect x="1220" y="386" width="246" height="118" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="2"/>
  <text class="label" x="1262" y="432">Nginx webroot</text>
  <text class="mono" x="1262" y="468">/.well-known/...</text>

  <path d="M1154 444H1206" stroke="#000000" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="small" x="1154" y="418">파일 배치</text>

  <rect x="956" y="568" width="510" height="92" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="2"/>
  <text class="mono" x="992" y="610">authenticator = webroot</text>
  <text class="mono" x="992" y="642">webroot_path = /var/www/html</text>

  <path d="M1342 386V350C1342 326 1324 308 1300 308H1186" stroke="#737373" stroke-width="2.4" marker-end="url(#arrow-gray)"/>
  <text class="small" x="1180" y="286">Let's Encrypt가 port 80으로 검증 요청</text>

  <rect x="340" y="806" width="992" height="72" rx="36" fill="#fafafa" stroke="#e5e5e5" stroke-width="2"/>
  <text class="mono" x="384" y="851">certbot renew --dry-run  +  systemctl reload nginx  +  만료일 모니터링</text>
</svg>
